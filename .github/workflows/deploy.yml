name: Deploy to Render

# Auto-deploys to Render on every push to main.
# Two ways this fires:
#   1. Render's own auto-deploy (autoDeploy: true in render.yaml, enabled when
#      the repo is connected in the dashboard) — nothing needed here.
#   2. This workflow, which calls the Render Deploy API. Requires two repo
#      secrets (Settings -> Secrets and variables -> Actions):
#        RENDER_API_KEY    (Render dashboard: Account -> API Keys)
#        RENDER_SERVICE_ID (from your service URL, e.g. srv-xxxx)
#   Until those secrets are added, this job prints a skip notice (Render's
#   built-in auto-deploy still covers it).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render-deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Skipped GitHub-driven deploy - add RENDER_API_KEY and RENDER_SERVICE_ID secrets to enable it (Render's built-in auto-deploy still covers pushes)."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Deploy triggered: https://dashboard.render.com/web/srv/${RENDER_SERVICE_ID}"
