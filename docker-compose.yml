services:
  dutchkem:
    build: .
    image: dutchkem-model-4.0
    container_name: dutchkem
    ports:
      - "5000:5000"   # Gradio web UI
      - "8000:8000"   # REST API (start separately with `python -m web.api`)
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: dutchkem-ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Pull a local fallback model on first start:
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama serve &
        sleep 5 &&
        ollama pull qwen3-coder &&
        wait

volumes:
  ollama:
